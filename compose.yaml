###################################################
# この Compose ファイルは、ToDo アプリの開発環境を提供します。
#
# アプリケーションの最終バージョンではフロントエンドとバックエンドがバンドルされていますが、
# プロキシを使用してリクエストを適切なサービスにルーティングすることで、その動作を「シミュレート」することができます。
# /api へのすべてのリクエストはバックエンドにルーティングされ、それ以外のリクエストはすべてクライアントサービスに送信されます。
# ルーティングルールには一部重複がありますが、プロキシは最も具体的なルールに基づいてサービスを決めます。
#
# デバッグやトラブルシューティングを容易にするため、
# MySQL データベースへの Web インターフェースを提供する phpMyAdmin も含まれています。
###################################################

###################################################
# Services
#
# Services は、アプリケーションスタックを構成する個々のコンポーネントを定義します。
# Service ごとに、個別のコンテナが起動されます。
###################################################
services:

  ###################################################
  # Service: proxy
  #
  # このサービスは、リクエストを適切なサービスへ転送するリバースプロキシです。
  # HTTPルーターやロードバランサーのようなものと考えてください。
  # これは単にリクエストを転送するものであり、フロントエンドとバックエンドが統合された
  # アプリケーションの最終バージョンをシミュレートすることを可能にします。
  # また、このサービスを使用して、phpMyAdmin へのリクエストをルーティングすることもできます。
  # phpMyAdmin は localhost からはアクセスできず、db.localhost からアクセスする必要があります。
  #
  # このサービスのイメージは Docker Hub から直接取得したもので、Docker 公式イメージです。
  # Traefik は様々な方法で設定できるため、ここでは新しいコンテナの Docker イベントを監視し、
  # そのラベルを設定に利用するように構成しています。そのため、Docker ソケットがマウントされています。
  #
  # また、ホストマシンからプロキシに接続するために、ポート 80 を公開しています。
  ###################################################
  proxy:
    image: traefik:v3.6
    command: --providers.docker
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ###################################################
  # Service: backend
  # 
  # このサービスは、アプリ向けのAPIを提供するNode.jsサーバーです。
  # コンテナが起動すると、backend-devステージをターゲットとして
  # Dockerfileをビルドした結果得られるイメージが使用されます。
  #
  # Compose Watchの設定は、ホストマシンからコンテナへコードを
  # 自動的に同期するために使用されます。これにより、コードに変更が加えられた際に
  # サーバーが自動的に再読み込みされます。
  #
  # 環境変数により、アプリケーションがデータベースに接続できるよう設定されます。
  # データベースの設定もこの Compose ファイル内で行われます。
  # もちろん、本番環境ではこれらの値をハードコーディングすることはありません。
  # しかし、開発環境では、これらの値で問題ありません。
  #
  # 最後に、ラベルを使用して、Traefik（リバースプロキシ）に
  # 適切なルーティングルールを設定します。この場合、localhost/api/* へのすべてのリクエストは
  # このサービスのポート 3000 に転送されます。
  ###################################################
  backend:
    build:
      context: ./
      target: backend-dev
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos
    depends_on:
      mysql:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          action: sync
          target: /usr/local/app/src
        - path: ./backend/package.json
          action: rebuild
    labels:
      traefik.http.routers.backend.rule: Host(`localhost`) && PathPrefix(`/api`)
      traefik.http.services.backend.loadbalancer.server.port: 3000

  ###################################################
  # Service: client
  #
  # クライアントサービスとは、アプリのフロントエンドを提供する React アプリのことです。
  # コンテナが起動すると、dev ステージを対象として Dockerfile をビルドした結果として生成された
  # イメージが使用されます。
  #
  # Compose Watch の設定は、ホストマシンからコンテナへコードを自動的に同期するために使用されます。
  # これにより、コードに変更が加えられた際にクライアントが自動的に
  # 再読み込みされるようになります。
  #
  # ラベルは、Traefik（リバースプロキシ）に
  # 適切なルーティングルールを設定するために使用されます。この場合、localhost へのすべてのリクエストは
  # このサービスのポート 5173 に転送されます。
  ###################################################
  client:
    build:
      context: ./
      target: client-dev
    develop:
      watch:
        - path: ./client/src
          action: sync
          target: /usr/local/app/src
        - path: ./client/package.json
          action: rebuild
    labels:
      traefik.http.routers.client.rule: Host(`localhost`)
      traefik.http.services.client.loadbalancer.server.port: 5173


  ###################################################
  # Service: mysql
  #
  # MySQL サービスは、アプリケーションにデータベースを提供するために使用されます。
  # このサービスのイメージは Docker Hub から直接取得されており、Docker 公式イメージです。
  #
  # データは todo-mysql-data という名前のボリュームに永続化されます。
  # ボリュームを使用することで、データを失うことなくサービスを停止することができます。
  # サービスを再起動しても、データはそのまま残っています（もちろん、ボリュームを
  # 削除していない場合に限ります！）。
  #
  # 環境変数では、root パスワードと作成するデータベース名を設定します。
  # これらはローカル開発でのみ使用されるため、
  # ここでハードコーディングしても問題ありません。
  ###################################################
  mysql:
    image: mysql:9.3
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  ###################################################
  # Service: phpmyadmin
  #
  # このサービスは、MySQL データベースへの Web インターフェースを提供します。
  # これは、データやスキーマなどのデバッグやトラブルシューティングに役立ちます。
  # このサービスのイメージは Docker Hub から直接取得されており、Docker 公式イメージです。
  #
  # 環境変数により、データベースへの接続設定が行われ、
  # デフォルトの認証情報が指定されるため、ログインすることなく
  # すぐにインターフェースを開くことができます。
  #
  # ラベルは、Traefik（リバースプロキシ）にルーティングルールを設定するために使用されます。
  # この場合、db.localhost へのすべてのリクエストは、
  # このサービスのポート 80 に転送されます。
  ###################################################
  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
    labels:
      traefik.http.routers.phpmyadmin.rule: Host(`db.localhost`)
      traefik.http.services.phpmyadmin.loadbalancer.server.port: 80

###################################################
# Volumes
#
# このアプリケーションスタックには、ボリュームが1つしかありません。
# これは、MySQL サービスのデータを永続化するために使用されます。
# ここではデフォルト値のみを使用するため、ボリュームに関する設定は一切行っていません。
###################################################
volumes:
  todo-mysql-data:
